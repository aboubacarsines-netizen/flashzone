<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashZone - Vraies Vidéos En Ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRE DE NAVIGATION -->
    <header class="navbar">
        <div class="nav-left">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="logo" onclick="location.reload()">⚡ Flash<span>Zone</span></div>
        </div>
        
        <div class="nav-center">
            <input type="text" class="search-bar" id="global-search" placeholder="Rechercher sur FlashZone..." onkeyup="searchVideos()">
            <button class="search-btn" onclick="searchVideos()">🔍</button>
        </div>
        
        <div class="nav-right">
            <button class="nav-icon-btn" onclick="openCreateModal()">➕ Créer</button>
            <div class="user-profile">AD</div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <div class="main-layout" id="mainLayout">
        <section class="left-column" id="video-feed">
            <div class="video-card">
                <div class="video-player-container">
                    <!-- Vrai lien d'intégration YouTube autorisé -->
                    <iframe class="main-video" id="video-player-core" src="https://youtube.com" title="FlashZone Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <h2 class="video-title" id="video-title-core">MUSIQUE SANS DROIT D'AUTEUR INTERNATIONALE 🎬🚀</h2>
                    <div class="author-block">
                        <div class="user-profile-img">AD</div>
                        <div class="author-details">
                            <span class="video-author">Aboubacar Dev ✓</span>
                            <span class="sub-count">1,2 M d'abonnés</span>
                        </div>
                        <button class="btn-subscribe-yt" onclick="toggleSubscribe(this)">S'abonner</button>
                    </div>
                </div>
                <div class="interaction-bar">
                    <div class="like-dislike-group">
                        <button class="btn-like-yt" onclick="toggleLike(this, 'like-count-main')">👍 <span id="like-count-main">29 k</span></button>
                    </div>
                    <button class="btn-action-yt" onclick="alert('Lien copié !')">↪️ Partager</button>
                </div>
            </div>
        </section>

        <!-- COLONNE DROITE : LES VRAIES SUGGESTIONS -->
        <aside class="right-column">
            <h3 class="sidebar-title">À suivre</h3>
            
            <div class="suggested-video" onclick="playSuggested('https://youtube.com', 'BIG BUCK BUNNY - SANS DROIT D\'AUTEUR 🐰')">
                <div class="thumbnail" style="background:#222; display:flex; justify-content:center; align-items:center; font-size:20px;">▶️</div>
                <div class="suggested-info">
                    <h4>BIG BUCK BUNNY - SANS DROIT D'AUTEUR 🐰</h4>
                    <p>Fondation Blender</p>
                </div>
            </div>

            <div class="suggested-video" onclick="playSuggested('https://youtube.com', 'TEARS OF STEEL - SCIENCE-FICTION LIBRE 🌍')">
                <div class="thumbnail" style="background:#222; display:flex; justify-content:center; align-items:center; font-size:20px;">▶️</div>
                <div class="suggested-info">
                    <h4>TEARS OF STEEL - SCIENCE-FICTION LIBRE 🌍</h4>
                    <p>Blender Studio</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- FENÊTRE DE TÉLÉCHARGEMENT -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h3>Publier une vidéo</h3>
            <input type="text" id="video-title-input" placeholder="Titre de la vidéo...">
            <div class="modal-buttons">
                <button class="btn-close-modal" onclick="closeCreateModal()">Annuler</button>
                <button class="btn-submit-modal" onclick="uploadNewVideo()">Mettre en ligne</button>
            </div>
        </div>
    </div>

    <script>
        function toggleSubscribe(button) {
            button.classList.toggle('subscribed');
            button.innerText = button.classList.contains('subscribed') ? "Abonné ✓" : "S'abonner";
        }
        function toggleLike(button, id) {
            button.classList.toggle('liked');
            let c = document.getElementById(id);
            if(c) c.innerText = button.classList.contains('liked') ? "30 k" : "29 k";
        }
        
        function openCreateModal() { document.getElementById('createModal').style.display = 'flex'; }
        function closeCreateModal() { document.getElementById('createModal').style.display = 'none'; }

        function uploadNewVideo() {
            let titleInput = document.getElementById('video-title-input');
            if (titleInput.value.trim() === "") { alert("Veuillez choisir un titre."); return; }
            alert("Vidéo ajoutée !");
            closeCreateModal();
        }

        function playSuggested(url, title) {
            document.getElementById('video-player-core').src = url;
            document.getElementById('video-title-core').innerText = title;
        }
    </script>
</body>
</html>
