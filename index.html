<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashZone - En Ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRE DE NAVIGATION -->
    <header class="navbar">
        <div class="nav-left">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="logo" onclick="location.reload()">⚡ Flash<span>Zone</span></div>
        </div>
        
        <div class="nav-center">
            <input type="text" class="search-bar" id="global-search" placeholder="Rechercher sur FlashZone..." onkeyup="searchVideos()">
            <button class="search-btn" onclick="searchVideos()">🔍</button>
        </div>
        
        <div class="nav-right">
            <button class="nav-icon-btn" onclick="openCreateModal()">➕ Créer</button>
            <button class="nav-icon-btn" onclick="alert('🔔 Aucune notification.')">🔔</button>
            <div class="user-profile">AD</div>
        </div>
    </header>

    <!-- MENU LATÉRAL -->
    <nav class="sidebar" id="sidebarMenu">
        <a href="#" class="active" onclick="location.reload()">🏠 Accueil</a>
        <a href="#" onclick="alert('Shorts bientôt disponibles !')">🩳 Shorts</a>
        <a href="#" onclick="alert('Abonnements à venir.')">🔔 Abonnements</a>
        <hr>
        <a href="#" onclick="alert('Bibliothèque locale.')">📚 Bibliothèque</a>
    </nav>

    <!-- CONTAINER PRINCIPAL -->
    <div class="main-layout" id="mainLayout">
        <section class="left-column" id="video-feed">
            <div class="video-card">
                <div class="video-player-container">
                    <video class="main-video" id="video-player-core" controls poster="https://unsplash.com">
                        <source src="https://googleapis.com" type="video/mp4">
                    </video>
                </div>
                <div class="video-info">
                    <h2 class="video-title" id="video-title-core">J'AI CRÉÉ MON PROPRE RÉSEAU SOCIAL À 11 ANS ! 🚀</h2>
                    <div class="author-block">
                        <div class="user-profile-img">AD</div>
                        <div class="author-details">
                            <span class="video-author">Aboubacar Dev ✓</span>
                            <span class="sub-count">1,2 M d'abonnés</span>
                        </div>
                        <button class="btn-subscribe-yt" onclick="toggleSubscribe(this)">S'abonner</button>
                    </div>
                </div>
                <div class="interaction-bar">
                    <div class="like-dislike-group">
                        <button class="btn-like-yt" onclick="toggleLike(this, 'like-count-main')">👍 <span id="like-count-main">29 k</span></button>
                        <button class="btn-dislike-yt" onclick="toggleDislike(this)">👎</button>
                    </div>
                    <button class="btn-action-yt" onclick="alert('Lien copié !')">↪️ Partager</button>
                </div>
                <div class="comments-section">
                    <h3>Commentaires</h3>
                    <div class="comment-form">
                        <input type="text" class="comment-input-field" placeholder="Ajouter un commentaire public...">
                        <button class="btn-comment-yt" onclick="addComment(this)">Ajouter</button>
                    </div>
                    <div class="comments-list"></div>
                </div>
            </div>
        </section>

        <!-- DROITE -->
        <aside class="right-column">
            <h3 class="sidebar-title">À suivre</h3>
            <div class="suggested-video" onclick="playSuggested('https://googleapis.com', 'COMMENT JE CODE SUR MON ORDI 💻')">
                <div class="thumbnail">
                    <video src="https://googleapis.com" muted></video>
                </div>
                <div class="suggested-info">
                    <h4>COMMENT JE CODE SUR MON ORDI 💻</h4>
                    <p>Aboubacar Dev</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- FENÊTRE DE TÉLÉCHARGEMENT -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h3>Publier une vidéo locale</h3>
            <input type="file" id="video-file-input" accept="video/mp4">
            <input type="text" id="video-title-input" placeholder="Titre de la vidéo...">
            <div class="modal-buttons">
                <button class="btn-close-modal" onclick="closeCreateModal()">Annuler</button>
                <button class="btn-submit-modal" onclick="uploadNewVideo()">Mettre en ligne</button>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebarMenu').classList.toggle('open');
            document.getElementById('mainLayout').classList.toggle('shifted');
        }
        function toggleSubscribe(button) {
            button.classList.toggle('subscribed');
            button.innerText = button.classList.contains('subscribed') ? "Abonné ✓" : "S'abonner";
        }
        function toggleLike(button, id) {
            button.classList.toggle('liked');
            let c = document.getElementById(id);
            if(c) c.innerText = button.classList.contains('liked') ? "30 k" : "29 k";
        }
        function toggleDislike(button) { button.classList.toggle('liked'); }
        
        function openCreateModal() { document.getElementById('createModal').style.display = 'flex'; }
        function closeCreateModal() { document.getElementById('createModal').style.display = 'none'; }

        function uploadNewVideo() {
            let fileInput = document.getElementById('video-file-input');
            let titleInput = document.getElementById('video-title-input');
            if (fileInput.files.length === 0 || titleInput.value.trim() === "") {
                alert("Veuillez choisir une vidéo et un titre.");
                return;
            }
            let file = fileInput.files[0];
            let title = titleInput.value.trim();
            let videoURL = URL.createObjectURL(file);

            let feed = document.getElementById('video-feed');
            let newCard = document.createElement('div');
            newCard.classList.add('video-card');
            let randomId = "like-" + Math.floor(Math.random() * 1000);

            newCard.innerHTML = `
                <div class="video-player-container"><video class="main-video" controls src="${videoURL}" autoplay></video></div>
                <div class="video-info"><h2 class="video-title">${title}</h2></div>
                <div class="interaction-bar">
                    <button class="btn-like-yt" onclick="toggleLike(this, '${randomId}')">👍 <span id="${randomId}">0</span></button>
                </div>
                <div class="comments-section">
                    <div class="comment-form">
                        <input type="text" class="comment-input-field" placeholder="Ajouter un commentaire...">
                        <button class="btn-comment-yt" onclick="addComment(this)">Ajouter</button>
                    </div>
                    <div class="comments-list"></div>
                </div>
            `;
            feed.insertBefore(newCard, feed.firstChild);
            closeCreateModal();
        }

        function addComment(button) {
            let input = button.previousElementSibling;
            let text = input.value.trim();
            if (text !== "") {
                let list = button.parentElement.nextElementSibling;
                let item = document.createElement('div');
                item.className = "comment-item";
                item.innerHTML = `<strong>Moi</strong><p>${text}</p>`;
                list.insertBefore(item, list.firstChild);
                input.value = "";
            }
        }

        function playSuggested(url, title) {
            document.getElementById('video-player-core').src = url;
            document.getElementById('video-title-core').innerText = title;
            document.getElementById('video-player-core').play();
        }

        function searchVideos() {
            let query = document.getElementById('global-search').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');
            for(let card of cards) {
                let title = card.querySelector('.video-title').innerText.toLowerCase();
                card.style.display = title.includes(query) ? "block" : "none";
            }
        }
    </script>
</body>
</html>
